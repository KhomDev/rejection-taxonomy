version: 2
updates:
  # Python tooling. The only runtime dependency is PyYAML, declared in
  # pyproject.toml; updates are grouped into one pull request.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by ci.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]
