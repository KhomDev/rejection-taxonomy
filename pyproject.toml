[project]
name = "rejection-taxonomy"
version = "0.7.0"
description = "113 logged bug-bounty rejections, classified by triage outcome and earliest catchable gate. Rejections only; no positive class."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6,<7"]
readme = "README.md"
license = { text = "MIT" }
keywords = ["bug-bounty", "smart-contract", "triage", "duplicate-detection", "security-economics"]

# This is a dataset with scripts, run from a checkout (`python scripts/query.py`).
# It is deliberately NOT an installable package: there are no modules to install,
# and `pip install .[dev]` only installs the pinned tools below. 0.5.1 declared a
# console script whose module never shipped in the wheel; that is why there is none.
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/KhomDev/rejection-taxonomy"
Changelog = "https://github.com/KhomDev/rejection-taxonomy/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  # Long docstrings and explanatory comments are the point of this repository.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# SystemExit is not an exception being handled; "raise from" would be noise.
"scripts/*.py" = ["B904"]
